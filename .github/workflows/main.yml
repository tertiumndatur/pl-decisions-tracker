name: Update data and publish dashboard

on:
  schedule:
    - cron: "17 8,21 * * *"
      timezone: "Europe/Warsaw"
  workflow_dispatch:
    inputs:
      year:
        description: "Optional year to close or refresh"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tracker-update
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      YEAR: ${{ inputs.year }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Collect complete source snapshot
        run: python3 scripts/collect.py --insecure

      - name: Build site from validated snapshots
        run: python3 scripts/build.py

      - name: Check exported data and UI calculations
        run: |
          python3 -m unittest discover -s tests
          node --test tests/*.test.js

      - name: Commit new source data
        run: |
          git config user.name "Automated"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Update migration snapshots"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
